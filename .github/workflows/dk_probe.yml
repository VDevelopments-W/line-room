name: DK probe (one-off)
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python debug/dk_probe.py || true
      - run: bash commit.sh "DK probe output" debug/dk_probe
