# Pulls Kalshi NFL player prop prices every 30 minutes, Thursday through Monday,
# and commits site/data/kalshi.json. Runs on GitHub's servers, so your computer can stay off.
name: Kalshi prop prices
on:
  schedule:
    - cron: "*/30 * * * 0,1,4,5,6"   # every 30 min, Thu-Mon (UTC)
    - cron: "0 */6 * * 2,3"          # every 6 hours Tue-Wed
  workflow_dispatch: {}               # "Run workflow" button
  push:                               # also run when the script or this file changes
    branches: [main]
    paths: ["kalshi.py", ".github/workflows/kalshi.yml"]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Pull Kalshi prices
        run: |
          out=$(python kalshi.py --print 2>&1) || { echo "::error::kalshi.py failed: $(echo "$out" | tail -5 | tr '\n' ' ')"; exit 1; }
          echo "$out"
          echo "::notice::$(echo "$out" | head -1)"
      - name: Commit if prices changed
        shell: bash {0}
        run: |
          git config user.name "line-room-bot"
          git config user.email "line-room-bot@users.noreply.github.com"
          r=$(git add -f site/data/kalshi.json 2>&1) || { echo "::error::git add: $r"; exit 1; }
          if git diff --cached --quiet; then echo "::notice::No price changes"; exit 0; fi
          r=$(git commit -qm "Kalshi prices $(date -u +%FT%H:%MZ)" 2>&1) || { echo "::error::git commit: $r"; exit 1; }
          git pull --rebase -q origin main >/dev/null 2>&1
          r=$(git push 2>&1) || { echo "::error::git push: $(echo "$r" | tr '\n' ' ')"; exit 1; }
          echo "::notice::Prices committed"
