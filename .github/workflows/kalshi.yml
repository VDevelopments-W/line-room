# Kalshi NFL player prop prices every 30 minutes Thu-Mon (every 6 hours Tue-Wed).
# Saves site/data/kalshi.json, plus data/kalshi_close/<game_id>.json frozen at kickoff for grading.
name: Kalshi prop prices
on:
  schedule:
    - cron: "*/30 * * * 0,1,2,4,5,6"
    - cron: "0 */6 * * 3"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["kalshi.py", ".github/workflows/kalshi.yml"]
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Pull Kalshi prices
        run: |
          out=$(python kalshi.py --print 2>&1) || { echo "::error::kalshi.py failed: $(echo "$out" | tail -5 | tr '\n' ' ')"; exit 1; }
          echo "$out"; echo "::notice::$(echo "$out" | head -1)"
      - run: bash commit.sh "Kalshi prices $(date -u +%FT%H:%MZ)" site/data/kalshi.json data/kalshi_close
